# =============================================================================
# SGTE Staging Compose — Infrastructure Services
#
# This file provides the infrastructure services for staging/production.
# Dokploy manages the app container separately (see docs/deployment.md).
#
# Local testing (builds and runs the app alongside infrastructure):
#   docker compose -f compose.staging.yaml --profile local --env-file .env.staging up -d --build
#
# Infrastructure only (for Dokploy — paste this file as-is):
#   docker compose -f compose.staging.yaml up -d
# =============================================================================

services:
    app:
      profiles: [local]
      build:
        context: .
        dockerfile: docker/production/Dockerfile
      ports:
        - '${APP_PORT:-8000}:8000'
        - '${REVERB_PORT:-8080}:8080'
      env_file: .env.staging
      networks:
        - sgte
      depends_on:
        pgsql:
          condition: service_healthy
        redis:
          condition: service_healthy
        typesense:
          condition: service_healthy
        minio:
          condition: service_healthy
        mailpit:
          condition: service_started
    pgsql:
        image: 'postgres:18-alpine'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sgte-pgsql:/var/lib/postgresql'
        networks:
            - sgte
            - dokploy-network
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        volumes:
            - 'sgte-redis:/data'
        networks:
            - sgte
            - dokploy-network
        command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
        healthcheck:
            test:
                - CMD
                - redis-cli
                - '-a'
                - '${REDIS_PASSWORD:-secret}'
                - ping
            retries: 3
            timeout: 5s
    typesense:
        image: 'typesense/typesense:27.1'
        environment:
            TYPESENSE_DATA_DIR: '${TYPESENSE_DATA_DIR:-/typesense-data}'
            TYPESENSE_API_KEY: '${TYPESENSE_API_KEY:-xyz}'
            TYPESENSE_ENABLE_CORS: '${TYPESENSE_ENABLE_CORS:-true}'
        volumes:
            - 'sgte-typesense:/typesense-data'
        networks:
            - sgte
            - dokploy-network
        healthcheck:
            test:
                - CMD
                - bash
                - '-c'
                - 'exec 3<>/dev/tcp/localhost/8108 && printf ''GET /health HTTP/1.1\r\nConnection: close\r\n\r\n'' >&3 && head -n1 <&3 | grep ''200'' && exec 3>&-'
            retries: 5
            timeout: 7s
    minio:
        image: 'minio/minio:latest'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-sail}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-password}'
        volumes:
            - 'sgte-minio:/data'
        networks:
            - sgte
            - dokploy-network
        command: 'minio server /data --console-address ":8900"'
        healthcheck:
            test:
                - CMD
                - mc
                - ready
                - local
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        networks:
            - sgte
            - dokploy-network
networks:
    sgte:
        driver: bridge
    dokploy-network:
        name: dokploy-network
        external: true
volumes:
    sgte-pgsql:
        driver: local
    sgte-redis:
        driver: local
    sgte-typesense:
        driver: local
    sgte-minio:
        driver: local
